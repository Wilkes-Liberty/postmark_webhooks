postmark_webhooks.settings:
  type: config_object
  label: 'Postmark Webhooks settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable suppression of outbound mail to bounced/spam addresses'
    bounce_suppression_days:
      type: integer
      label: 'Soft-bounce suppression window (days)'
      constraints:
        Range:
          min: 0
          max: 365
    complaint_suppression_days:
      type: integer
      label: 'Spam-complaint suppression window (days; 0 = permanent)'
      constraints:
        Range:
          min: 0
          max: 3650
    event_retention_days:
      type: integer
      label: 'Postmark event retention (days; 0 = keep forever)'
      constraints:
        Range:
          min: 0
          max: 3650
    event_retention_batches:
      type: integer
      label: 'Retention batches per cron run'
      constraints:
        Range:
          min: 1
          max: 40
    event_retention_time_budget_seconds:
      type: integer
      label: 'Retention wall-time budget (seconds; 0 = batch count only)'
      constraints:
        Range:
          min: 0
          max: 120
    health_expected_activity_seconds:
      type: integer
      label: 'Expected accepted-intake window (seconds; 0 = silence is unknown)'
      constraints:
        Range:
          min: 0
          max: 31536000
    health_retention_backlog_warning:
      type: integer
      label: 'Expired-history warning threshold (0 = disabled)'
      constraints:
        Range:
          min: 0
          max: 1000000
    health_rotation_warning_seconds:
      type: integer
      label: 'Previous-secret expiry warning (seconds; 0 = disabled)'
      constraints:
        Range:
          min: 0
          max: 2592000
    health_alert_cooldown_seconds:
      type: integer
      label: 'Repeated-alert cooldown (seconds; 0 = only on change)'
      constraints:
        Range:
          min: 0
          max: 604800
    integration_events_enabled:
      type: boolean
      label: 'Enable post-commit integration events'
    integration_events_batch:
      type: integer
      label: 'Integration deliveries per cron run'
      constraints:
        Range:
          min: 1
          max: 250
    integration_events_retention_seconds:
      type: integer
      label: 'Delivered outbox retention (seconds; 0 = keep)'
      constraints:
        Range:
          min: 0
          max: 31536000
    integration_events_max_attempts:
      type: integer
      label: 'Maximum delivery attempts'
      constraints:
        Range:
          min: 1
          max: 32
    source_policies:
      type: sequence
      label: 'Explicit server and stream policy mappings'
      sequence:
        type: mapping
        mapping:
          server_id:
            type: string
            label: 'Postmark server ID'
          message_stream:
            type: string
            label: 'Postmark message stream'
          scope:
            type: string
            label: 'Suppression scope'
            constraints:
              Choice:
                choices: [global, source]
