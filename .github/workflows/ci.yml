name: CI

on:
  push:
    branches: [1.x]
  pull_request:

permissions:
  contents: read

jobs:
  kernel:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Advertised composer floor. Drupal 10.3 is past upstream security
          # support; keep the job isolated and do not treat it as a current
          # platform claim.
          - name: d10.3-php8.3-floor
            drupal: '10.3.*'
            php: '8.3'
            mailer: ''
            audit: false
          - name: d10.6-php8.3
            drupal: '10.6.*'
            php: '8.3'
            mailer: ''
            audit: true
          - name: d10.6-php8.3-mailer-1.6
            drupal: '10.6.*'
            php: '8.3'
            mailer: '1.6.2'
            audit: true
          - name: d10.6-php8.4-mailer-2.0
            drupal: '10.6.*'
            php: '8.4'
            mailer: '2.0.2'
            audit: true
          - name: d11.3-php8.3
            drupal: '11.3.*'
            php: '8.3'
            mailer: ''
            audit: true
          - name: d11.3-php8.5-mailer-2.0
            drupal: '11.3.*'
            php: '8.5'
            mailer: '2.0.2'
            audit: true
          - name: d11.4-php8.3
            drupal: '11.4.*'
            php: '8.3'
            mailer: ''
            audit: true
          - name: d11.4-php8.5-mailer-1.6
            drupal: '11.4.*'
            php: '8.5'
            mailer: '1.6.2'
            audit: true
          - name: d11.4-php8.5-mailer-2.0
            drupal: '11.4.*'
            php: '8.5'
            mailer: '2.0.2'
            audit: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drupal
          POSTGRES_PASSWORD: drupal
          POSTGRES_DB: drupal
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIMPLETEST_DB: pgsql://drupal:drupal@127.0.0.1:5432/drupal
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, gd
          tools: composer:v2
          coverage: none
      - name: Create isolated compatibility fixture
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.drupal }}
          MAILER_CONSTRAINT: ${{ matrix.mailer }}
          AUDIT_BLOCK_INSECURE: ${{ matrix.audit }}
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/create-ci-fixture.py"
          composer install --working-dir=/tmp/postmark-ci --no-interaction --no-progress
          mkdir -p /tmp/postmark-ci/web/modules/contrib
          ln -s "$GITHUB_WORKSPACE" /tmp/postmark-ci/web/modules/contrib/postmark_webhooks
      - name: Record resolved versions
        working-directory: /tmp/postmark-ci
        env:
          MAILER_CONSTRAINT: ${{ matrix.mailer }}
        run: |
          package_version() {
            composer show --no-ansi "$1" | awk '/^versions/{print $NF; exit}'
          }
          {
            echo "### ${{ matrix.name }}"
            echo "- PHP: \`$(php -r 'echo PHP_VERSION;')\`"
            echo "- Drupal constraint: \`${{ matrix.drupal }}\`"
            echo "- Drupal core: \`$(package_version drupal/core)\`"
            echo "- drush: \`$(package_version drush/drush)\`"
            if [ -n "$MAILER_CONSTRAINT" ]; then
              echo "- Mailer Plus constraint: \`$MAILER_CONSTRAINT\`"
              echo "- Mailer Plus: \`$(package_version drupal/symfony_mailer)\`"
            else
              echo "- Mailer Plus: not installed"
            fi
            echo "- Composer audit block-insecure: \`${{ matrix.audit }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          composer show --no-ansi drupal/core
          composer show --no-ansi drupal/core-recommended
          composer show --no-ansi drush/drush
          if [ -n "$MAILER_CONSTRAINT" ]; then
            composer show --no-ansi drupal/symfony_mailer
          fi
      - name: Composer security audit
        if: matrix.audit
        working-directory: /tmp/postmark-ci
        run: composer audit --no-interaction --abandoned=report
      - name: Coding standards
        run: /tmp/postmark-ci/vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,install "$GITHUB_WORKSPACE"
      - name: Start disposable HTTP server
        working-directory: /tmp/postmark-ci/web
        run: |
          mkdir -p sites/simpletest/browser_output
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8888 -t . .ht.router.php > /tmp/postmark-http.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/postmark-http.log
              exit 1
            fi
            if curl --silent --output /dev/null http://127.0.0.1:8888/robots.txt; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/postmark-http.log
          exit 1
      - name: Kernel and HTTP integration tests
        env:
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
        working-directory: /tmp/postmark-ci
        run: vendor/bin/phpunit -c web/core web/modules/contrib/postmark_webhooks/tests
      - name: Optional Mailer Plus integration
        if: matrix.mailer != ''
        run: python3 "$GITHUB_WORKSPACE/modules/postmark_webhooks_mailer/tests/run.py" /tmp/postmark-ci
      - name: Optional read-only reconciliation tests
        working-directory: /tmp/postmark-ci
        run: vendor/bin/phpunit -c web/core "$GITHUB_WORKSPACE/modules/postmark_webhooks_reconcile/tests"
      - name: Drush discovery and JSON diagnostics
        run: python3 "$GITHUB_WORKSPACE/tests/fixtures/drush-diagnostics.py" /tmp/postmark-ci
      - name: Real subdirectory HTTP deployment
        run: |
          mkdir -p /tmp/postmark-subdirectory
          ln -s /tmp/postmark-ci/web /tmp/postmark-subdirectory/subdirectory
          POSTMARK_TEST_WEBROOT=/tmp/postmark-ci/web PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8890 -t /tmp/postmark-subdirectory "$GITHUB_WORKSPACE/tests/fixtures/subdirectory-router.php" > /tmp/postmark-subdirectory.log 2>&1 &
          server_pid=$!
          trap 'pkill -TERM -P "$server_pid" || true; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/postmark-subdirectory.log
              exit 1
            fi
            if curl --fail --silent --output /dev/null http://127.0.0.1:8890/subdirectory/robots.txt; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/postmark-subdirectory.log
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tests/fixtures/subdirectory-http.py" /tmp/postmark-ci http://127.0.0.1:8890

  # Risk-based driver coverage for #3621226. PostgreSQL remains the 9-job
  # kernel matrix above. These jobs run the same suite, including upgrades,
  # concurrent intake, privacy, retention and query-plan assertions.
  database:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql-8.4-d10.6-php8.3
            drupal: '10.6.*'
            php: '8.3'
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -pdrupal --silent
          - name: mysql-8.4-d11.4-php8.5
            drupal: '11.4.*'
            php: '8.5'
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -pdrupal --silent
          - name: mariadb-10.11-d10.6-php8.3
            drupal: '10.6.*'
            php: '8.3'
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
          - name: mariadb-10.11-d11.4-php8.5
            drupal: '11.4.*'
            php: '8.5'
            image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: drupal
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1:3306/drupal
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd
          tools: composer:v2
          coverage: none
      - name: Create isolated compatibility fixture
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.drupal }}
          MAILER_CONSTRAINT: ''
          AUDIT_BLOCK_INSECURE: 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/tests/fixtures/create-ci-fixture.py"
          composer install --working-dir=/tmp/postmark-ci --no-interaction --no-progress
          mkdir -p /tmp/postmark-ci/web/modules/contrib
          ln -s "$GITHUB_WORKSPACE" /tmp/postmark-ci/web/modules/contrib/postmark_webhooks
      - name: Record resolved versions
        working-directory: /tmp/postmark-ci
        run: |
          package_version() {
            composer show --no-ansi "$1" | awk '/^versions/{print $NF; exit}'
          }
          {
            echo "### ${{ matrix.name }}"
            echo "- PHP: \`$(php -r 'echo PHP_VERSION;')\`"
            echo "- Drupal core: \`$(package_version drupal/core)\`"
            echo "- Database: \`$(php -r 'echo (new PDO("mysql:host=127.0.0.1;dbname=drupal","drupal","drupal"))->query("SELECT VERSION()")->fetchColumn();')\`"
            echo "- Image: \`${{ matrix.image }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Composer security audit
        working-directory: /tmp/postmark-ci
        run: composer audit --no-interaction --abandoned=report
      - name: Start disposable HTTP server
        working-directory: /tmp/postmark-ci/web
        run: |
          mkdir -p sites/simpletest/browser_output
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8888 -t . .ht.router.php > /tmp/postmark-http.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/postmark-http.log
              exit 1
            fi
            if curl --silent --output /dev/null http://127.0.0.1:8888/robots.txt; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/postmark-http.log
          exit 1
      - name: Kernel and HTTP integration tests
        env:
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
        working-directory: /tmp/postmark-ci
        run: vendor/bin/phpunit -c web/core web/modules/contrib/postmark_webhooks/tests
      - name: Optional read-only reconciliation tests
        working-directory: /tmp/postmark-ci
        run: vendor/bin/phpunit -c web/core "$GITHUB_WORKSPACE/modules/postmark_webhooks_reconcile/tests"
      - name: Drush discovery and JSON diagnostics
        run: python3 "$GITHUB_WORKSPACE/tests/fixtures/drush-diagnostics.py" /tmp/postmark-ci
      - name: Real subdirectory HTTP deployment
        run: |
          mkdir -p /tmp/postmark-subdirectory
          ln -s /tmp/postmark-ci/web /tmp/postmark-subdirectory/subdirectory
          POSTMARK_TEST_WEBROOT=/tmp/postmark-ci/web PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8890 -t /tmp/postmark-subdirectory "$GITHUB_WORKSPACE/tests/fixtures/subdirectory-router.php" > /tmp/postmark-subdirectory.log 2>&1 &
          server_pid=$!
          trap 'pkill -TERM -P "$server_pid" || true; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/postmark-subdirectory.log
              exit 1
            fi
            if curl --fail --silent --output /dev/null http://127.0.0.1:8890/subdirectory/robots.txt; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/postmark-subdirectory.log
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tests/fixtures/subdirectory-http.py" /tmp/postmark-ci http://127.0.0.1:8890

  sqlite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite-d10.6-php8.3
            drupal: '10.6.*'
            php: '8.3'
          - name: sqlite-d11.4-php8.5
            drupal: '11.4.*'
            php: '8.5'
    env:
      SIMPLETEST_DB: sqlite://localhost//tmp/postmark-sqlite/site.sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd
          tools: composer:v2
          coverage: none
      - name: Create isolated compatibility fixture
        env:
          DRUPAL_CONSTRAINT: ${{ matrix.drupal }}
          MAILER_CONSTRAINT: ''
          AUDIT_BLOCK_INSECURE: 'true'
        run: |
          mkdir -p /tmp/postmark-sqlite
          python3 "$GITHUB_WORKSPACE/tests/fixtures/create-ci-fixture.py"
          composer install --working-dir=/tmp/postmark-ci --no-interaction --no-progress
          mkdir -p /tmp/postmark-ci/web/modules/contrib
          ln -s "$GITHUB_WORKSPACE" /tmp/postmark-ci/web/modules/contrib/postmark_webhooks
      - name: Record resolved versions
        working-directory: /tmp/postmark-ci
        run: |
          package_version() {
            composer show --no-ansi "$1" | awk '/^versions/{print $NF; exit}'
          }
          {
            echo "### ${{ matrix.name }}"
            echo "- PHP: \`$(php -r 'echo PHP_VERSION;')\`"
            echo "- Drupal core: \`$(package_version drupal/core)\`"
            echo "- Database: \`SQLite $(php -r 'echo (new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn();')\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Composer security audit
        working-directory: /tmp/postmark-ci
        run: composer audit --no-interaction --abandoned=report
      - name: Start disposable HTTP server
        working-directory: /tmp/postmark-ci/web
        run: |
          mkdir -p sites/simpletest/browser_output
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8888 -t . .ht.router.php > /tmp/postmark-http.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/postmark-http.log
              exit 1
            fi
            if curl --silent --output /dev/null http://127.0.0.1:8888/robots.txt; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/postmark-http.log
          exit 1
      - name: Kernel and HTTP integration tests
        env:
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
        working-directory: /tmp/postmark-ci
        run: vendor/bin/phpunit -c web/core web/modules/contrib/postmark_webhooks/tests
      - name: Optional read-only reconciliation tests
        working-directory: /tmp/postmark-ci
        run: vendor/bin/phpunit -c web/core "$GITHUB_WORKSPACE/modules/postmark_webhooks_reconcile/tests"
      - name: Drush discovery and JSON diagnostics
        run: python3 "$GITHUB_WORKSPACE/tests/fixtures/drush-diagnostics.py" /tmp/postmark-ci
      - name: Real subdirectory HTTP deployment
        run: |
          mkdir -p /tmp/postmark-subdirectory
          ln -s /tmp/postmark-ci/web /tmp/postmark-subdirectory/subdirectory
          POSTMARK_TEST_WEBROOT=/tmp/postmark-ci/web PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8890 -t /tmp/postmark-subdirectory "$GITHUB_WORKSPACE/tests/fixtures/subdirectory-router.php" > /tmp/postmark-subdirectory.log 2>&1 &
          server_pid=$!
          trap 'pkill -TERM -P "$server_pid" || true; kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/postmark-subdirectory.log
              exit 1
            fi
            if curl --fail --silent --output /dev/null http://127.0.0.1:8890/subdirectory/robots.txt; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/postmark-subdirectory.log
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tests/fixtures/subdirectory-http.py" /tmp/postmark-ci http://127.0.0.1:8890

  # Composer-install the Drupal.org archive, not the git checkout (#3621227).
  published:
    name: published-alpha2-d11.4-php8.4
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drupal
          POSTGRES_PASSWORD: drupal
          POSTGRES_DB: drupal
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIMPLETEST_DB: pgsql://drupal:drupal@127.0.0.1:5432/drupal
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd
          tools: composer:v2
          coverage: none
      - name: Verify published Drupal.org package
        env:
          DRUPAL_CONSTRAINT: '11.4.*'
          POSTMARK_PUBLISHED_VERSION: '1.0.0-alpha2'
          POSTMARK_PUBLISHED_SHA1: e31e9f67b554cdaf35d04549d955310c0d1d3c30
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/verify-published-package.sh"
