services:
  postmark_webhooks.recipient_privacy:
    class: Drupal\postmark_webhooks\Operator\RecipientPrivacy
    arguments: ['@database', '@postmark_webhooks.operator_audit', '@email.validator', '@datetime.time']
  postmark_webhooks.operator_audit:
    class: Drupal\postmark_webhooks\Operator\OperatorAudit
    arguments: ['@database', '@?audit_chain.logger', '@logger.factory']
  postmark_webhooks.inspector:
    class: Drupal\postmark_webhooks\Operator\SuppressionInspector
    arguments: ['@database', '@postmark_webhooks.suppression_policy', '@postmark_webhooks.suppression_store', '@postmark_webhooks.operator_audit', '@email.validator', '@datetime.time', '@postmark_webhooks.integration_outbox']
  postmark_webhooks.event_timeline:
    class: Drupal\postmark_webhooks\Operator\EventTimeline
    arguments: ['@database', '@postmark_webhooks.suppression_policy']
  postmark_webhooks.integration_outbox:
    class: Drupal\postmark_webhooks\Integration\IntegrationOutbox
    arguments: ['@database', '@config.factory', '@module_handler', '@lock', '@logger.factory', '@datetime.time']
  postmark_webhooks.intake_metrics:
    class: Drupal\postmark_webhooks\Diagnostics\IntakeMetrics
    arguments: ['@database']
  postmark_webhooks.health:
    class: Drupal\postmark_webhooks\Diagnostics\HealthEvaluator
    arguments: ['@config.factory', '@datetime.time', '@postmark_webhooks.intake_metrics', '@postmark_webhooks.event_retention', '@module_handler']
  postmark_webhooks.health_alerts:
    class: Drupal\postmark_webhooks\Diagnostics\HealthAlerts
    arguments: ['@postmark_webhooks.health', '@state', '@config.factory', '@module_handler', '@logger.factory', '@datetime.time']
  postmark_webhooks.policy_preview:
    class: Drupal\postmark_webhooks\Diagnostics\PolicyPreview
    arguments: ['@postmark_webhooks.suppression_policy', '@config.factory', '@module_handler', '@email.validator', '@datetime.time', '@postmark_webhooks.intake_metrics', '@postmark_webhooks.health']
  postmark_webhooks.event_retention:
    class: Drupal\postmark_webhooks\Retention\EventRetention
    arguments: ['@database', '@lock']
  postmark_webhooks.config_import_validator:
    class: Drupal\postmark_webhooks\EventSubscriber\ConfigImportValidator
    arguments: ['@config.typed']
    tags:
      - { name: event_subscriber }
  postmark_webhooks.suppression_store:
    class: Drupal\postmark_webhooks\Suppression\SuppressionStore
    arguments: ['@database']
  postmark_webhooks.suppression_policy:
    class: Drupal\postmark_webhooks\Suppression\SuppressionPolicy
    arguments: ['@database', '@config.factory', '@datetime.time']
  Drupal\postmark_webhooks\Suppression\SuppressionPolicyInterface:
    alias: postmark_webhooks.suppression_policy
