services:
  postmark_webhooks.recipient_privacy:
    class: Drupal\postmark_webhooks\Operator\RecipientPrivacy
    arguments: ['@database', '@postmark_webhooks.operator_audit', '@email.validator', '@datetime.time']
  postmark_webhooks.operator_audit:
    class: Drupal\postmark_webhooks\Operator\OperatorAudit
    arguments: ['@database']
  postmark_webhooks.inspector:
    class: Drupal\postmark_webhooks\Operator\SuppressionInspector
    arguments: ['@database', '@postmark_webhooks.suppression_policy', '@postmark_webhooks.suppression_store', '@postmark_webhooks.operator_audit', '@email.validator', '@datetime.time']
  postmark_webhooks.intake_metrics:
    class: Drupal\postmark_webhooks\Diagnostics\IntakeMetrics
    arguments: ['@database']
  postmark_webhooks.policy_preview:
    class: Drupal\postmark_webhooks\Diagnostics\PolicyPreview
    arguments: ['@postmark_webhooks.suppression_policy', '@config.factory', '@module_handler', '@email.validator', '@datetime.time', '@postmark_webhooks.intake_metrics']
  postmark_webhooks.event_retention:
    class: Drupal\postmark_webhooks\Retention\EventRetention
    arguments: ['@database']
  postmark_webhooks.config_import_validator:
    class: Drupal\postmark_webhooks\EventSubscriber\ConfigImportValidator
    arguments: ['@config.typed']
    tags:
      - { name: event_subscriber }
  postmark_webhooks.suppression_store:
    class: Drupal\postmark_webhooks\Suppression\SuppressionStore
    arguments: ['@database']
  postmark_webhooks.suppression_policy:
    class: Drupal\postmark_webhooks\Suppression\SuppressionPolicy
    arguments: ['@database', '@config.factory', '@datetime.time']
  Drupal\postmark_webhooks\Suppression\SuppressionPolicyInterface:
    alias: postmark_webhooks.suppression_policy
